[workspace]
resolver = "2"
members = ["myna-hud", "myna-platform"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
